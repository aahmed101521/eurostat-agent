[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eurostat-agent"
version = "0.1.0"
description = "A provenance-first AI agent for European official statistics."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-cov",
    "hypothesis",
    "ruff>=0.16",
    "mypy>=2.3",
    "pre-commit>=4.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eurostat_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.coverage.run]
source = ["eurostat_agent"]

[tool.coverage.report]
show_missing = true
